<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayfinder - Travel Itinerary Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col font-sans">

  <!-- Simple Header -->
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <i data-lucide="compass" class="w-6 h-6 text-indigo-600"></i>
        <span class="font-bold text-lg text-gray-900">Wayfinder</span>
      </div>

      <div>
        <button id="btn-new-itinerary" class="inline-flex items-center px-3.5 py-2 rounded-md text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white transition">
          <i data-lucide="plus" class="w-4 h-4 mr-1.5"></i> New Trip
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- Overview Bar -->
    <div class="bg-white p-5 rounded-lg border border-gray-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-gray-900">My Trips</h1>
        <p class="text-sm text-gray-500 mt-0.5">Create, edit, and manage your travel itineraries.</p>
      </div>
      <div class="flex items-center space-x-6 text-sm">
        <div>
          <span class="text-gray-500 text-xs uppercase font-medium">Total Trips</span>
          <p id="stat-total-trips" class="text-lg font-bold text-gray-900">0</p>
        </div>
        <div class="border-l border-gray-200 pl-6">
          <span class="text-gray-500 text-xs uppercase font-medium">Total Budget</span>
          <p id="stat-total-budget" class="text-lg font-bold text-gray-900">$0</p>
        </div>
      </div>
    </div>

    <!-- Trips Grid -->
    <div id="itinerary-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Rendered dynamically via app.js -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-12 bg-white rounded-lg border border-dashed border-gray-300">
      <i data-lucide="map" class="w-8 h-8 text-gray-400 mx-auto mb-2"></i>
      <h3 class="text-base font-semibold text-gray-800">No trips planned yet</h3>
      <p class="text-xs text-gray-500 mt-1">Get started by creating your first itinerary.</p>
      <button onclick="openCreateModal()" class="mt-4 px-3 py-1.5 text-xs font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded">
        + Create Trip
      </button>
    </div>

  </main>

  <!-- MODAL: Create / Edit Trip -->
  <div id="itinerary-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 hidden">
    <div class="bg-white rounded-lg max-w-md w-full p-5 shadow-lg border border-gray-200">
      <div class="flex items-center justify-between pb-3 border-b border-gray-200">
        <h3 id="modal-title" class="text-base font-bold text-gray-900">New Trip</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="itinerary-form" class="mt-4 space-y-3.5">
        <input type="hidden" id="form-id">

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Trip Title *</label>
          <input type="text" id="form-title" required placeholder="e.g. 10 Days in Japan"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Destination *</label>
          <input type="text" id="form-destination" required placeholder="e.g. Tokyo & Kyoto, Japan"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:border-indigo-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Start Date</label>
            <input type="date" id="form-start-date"
              class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:border-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">End Date</label>
            <input type="date" id="form-end-date"
              class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:border-indigo-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Budget ($)</label>
            <input type="number" id="form-budget" min="0" placeholder="2500"
              class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:border-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Status</label>
            <select id="form-status" class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:border-indigo-500 focus:outline-none">
              <option value="planned">Planned</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Cover Photo (URL)</label>
          <input type="url" id="form-image" placeholder="https://..."
            class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Notes / Description</label>
          <textarea id="form-notes" rows="2" placeholder="Hotel reservations, flight numbers, ideas..."
            class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:border-indigo-500 focus:outline-none"></textarea>
        </div>

        <div class="flex items-center justify-end space-x-2 pt-3 border-t border-gray-200">
          <button type="button" onclick="closeModal()" class="px-3 py-1.5 text-xs text-gray-600 hover:bg-gray-100 rounded">Cancel</button>
          <button type="submit" class="px-3.5 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded">Save Trip</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Confirm Delete -->
  <div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 hidden">
    <div class="bg-white rounded-lg max-w-sm w-full p-5 border border-gray-200 text-center space-y-3">
      <h3 class="text-base font-bold text-gray-900">Delete Itinerary?</h3>
      <p class="text-xs text-gray-500">This action will permanently remove this itinerary from your list.</p>
      <div class="flex items-center justify-center space-x-2 pt-2">
        <button onclick="closeDeleteModal()" class="px-3 py-1.5 text-xs text-gray-600 hover:bg-gray-100 rounded">Cancel</button>
        <button id="btn-confirm-delete" class="px-3.5 py-1.5 text-xs font-semibold bg-red-600 hover:bg-red-700 text-white rounded">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
